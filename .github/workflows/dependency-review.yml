# ─────────────────────────────────────────────────────────────
# RunWatch — Dependency Review (PRs only)
# Flags license issues and known vulnerabilities in new deps
# ─────────────────────────────────────────────────────────────
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: 📋 Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          deny-licenses: GPL-3.0, AGPL-3.0
          # GHSA-qwww-vcr4-c8h2: react-router RSC Mode CSRF — only affects RSC mode, not used in this project
          allow-ghsas: GHSA-qwww-vcr4-c8h2
